name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sport_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sport_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@localhost:5432/sport_tracker_test?schema=public
      STRAVA_CLIENT_ID: ci-client-id
      STRAVA_CALLBACK_URL: http://localhost:4000/strava/callback
      SUPABASE_URL: https://example.supabase.co
      MAIL_ENABLED: "false"
      METRICS_ENABLED: "false"
      ALERTS_ENABLED: "false"
      APP_BASE_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for exposed secrets
        working-directory: .
        run: bash scripts/check-secrets.sh --tracked
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Configure ephemeral test secrets
        shell: bash
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "STRAVA_STATE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "STRAVA_TOKEN_ENCRYPTION_KEYS=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "STRAVA_CLIENT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy
      - name: Verify migration state
        run: pnpm exec prisma migrate status
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:test
      - run: pnpm exec jest --runInBand
      - run: pnpm exec jest --config ./test/jest-e2e.json --runInBand
      - run: pnpm build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for exposed secrets
        working-directory: .
        run: bash scripts/check-secrets.sh --tracked
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
